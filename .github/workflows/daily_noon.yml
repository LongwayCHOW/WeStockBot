name: Noon Valuation Radar

on:
  # 定时调度已上收至 daily_orchestrator.yml (唯一入口, 窗口 13:00~15:00 北京时间)
  # 本文件仅作手动单独触发/调试使用
  workflow_dispatch:

jobs:
  run_noon_radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Install dependencies
        # 只装实际用到的库 (requests + pandas), 不再装 akshare(未使用且安装慢)
        run: pip install -r requirements.txt

      - name: Run Noon Script
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TZ: Asia/Shanghai
        run: python noon_valuation.py
