name: Commodity Curve Push

on:
  schedule:
    # 北京时间 08:30 = UTC 00:30 (北京时间 = UTC+8)
    - cron: "30 0 * * *"
  workflow_dispatch: # 允许手动点击测试

# 需要写权限: 图片要 commit+push 进 charts/ 目录作为"图床"
permissions:
  contents: write

jobs:
  run_commodity_curve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          # 中文字体: 防止 matplotlib 图内中文显示为方框
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          pip install requests pandas matplotlib

      - name: Render Charts (生成国内外对照图)
        env:
          TZ: Asia/Shanghai
        run: python commodity_curve.py --render-only

      - name: Commit and Push Charts (图片+画廊页上仓库, Pages 自动发布)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add charts/ index.html
          if git diff --quiet && git diff --staged --quiet; then
            echo "✅ 无内容变化, 跳过提交"
          else
            git commit -m "Update commodity charts [skip ci]"
            # 防竞态: 推送前先 rebase 远程最新(可能有人手动 push 或上个 Actions 提交)
            # 若 rebase/push 仍失败(竞态), 回滚并跳过本次, 不报红, 下次运行自动重试
            git pull --rebase origin main && git push \
              || { git rebase --abort 2>/dev/null || true; echo "⚠️ 竞态导致推送失败, 已跳过(下次运行自动重试11)"; }
          fi

      - name: Push to WeChat (方糖推送, 引用图片外链)
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TZ: Asia/Shanghai
        run: python commodity_curve.py --push-only