name: Weekly Stock Selection Push

on:
  # 定时调度已上收至 daily_orchestrator.yml (唯一入口, 每周五 08:00~10:00 北京时间窗口)
  # 本文件仅作手动单独触发/调试使用
  workflow_dispatch:

jobs:
  run_selection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install pandas requests

      - name: Fetch A-share snapshot (新浪全市场)
        env:
          TZ: Asia/Shanghai
        run: python strategies_script/fetch_a_share_snapshot.py --output data/a_share_snapshot.csv

      - name: Run selection strategy (小市值低价 top5)
        env:
          TZ: Asia/Shanghai
        run: |
          python "strategies_script/gha_小市值+低价股+10万块_小市值最小top5_每周五.py" \
            --input data/a_share_snapshot.csv \
            --as-of "$(date +%F)" \
            --output data/selection.json

      - name: Push to WeChat (方糖)
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TZ: Asia/Shanghai
        run: python strategies_script/push_selection.py --input data/selection.json