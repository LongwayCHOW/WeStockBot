name: Evening A-Share Push

on:
  # 定时调度已上收至 daily_orchestrator.yml (唯一入口, 窗口 16:35~18:30 北京时间)
  # 本文件仅作手动单独触发/调试使用
  workflow_dispatch:

jobs:
  run_evening_analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Install dependencies
        # 只装实际用到的库 (requests + pandas), 不再装 akshare(未使用且安装慢)
        run: pip install -r requirements.txt

      - name: Run Evening Script
        env:
          #
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TZ: Asia/Shanghai
        run: python evening_push.py

      - name: Commit and Push Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/history_sector_sina.csv
          # 只有当文件有变化时才提交，防止报错
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update fund flow data [skip ci]" && git push)
