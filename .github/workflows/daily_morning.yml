name: Daily Push

on:
  workflow_dispatch: # 已合并到 Commodity Curve Push, 此处不再定时推送, 仅可手动触发

jobs:
  run_script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Install dependencies
        # 只装实际用到的库 (requests + pandas)
        run: pip install -r requirements.txt

      - name: Run script
        env:
          # 会去读配置的保险箱
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TZ: Asia/Shanghai
        run: python main.py
